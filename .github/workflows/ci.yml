name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff Check
        run: uv run ruff check --output-format=github .

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Mypy Type Checking
        run: uv run mypy src/ tests/

      - name: Pytest Suite
        run: uv run pytest -v

  latex:
    runs-on: [self-hosted, linux]
    # TeX Live comes from the host (XXXXXXX and XXXXX carry TeX Live 2023): the
    # own runners cannot run docker, and the gate passed natively (own-ci-runners).
    steps:
      - uses: actions/checkout@v4

      - name: LaTeX Quality Gate
        run: bash scripts/check-latex.sh
