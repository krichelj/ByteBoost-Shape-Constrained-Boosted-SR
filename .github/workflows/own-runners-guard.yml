# Proves this repo's Actions run on self-hosted runners and nowhere else
# (own-ci-runners skill). Generated: keep `workflows:` naming every other
# workflow here; the guard itself fails when one is missing.
name: Own runners guard

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  workflow_run:
    workflows: ["ci"]
    types: [requested, completed]

permissions:
  contents: read
  actions: write

# One group per event and subject: a newer push to the same ref replaces a stale
# check of it, while every other workflow's run keeps a group of its own.
concurrency:
  group: own-runners-guard-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  guard:
    name: Own runners guard
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Pinned to the commit behind tag v7.0.1 (gh api repos/actions/checkout/git/ref/tags/v7.0.1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove where this repo's Actions run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # guard.py needs Python 3.12 (PEP 695 type aliases). Unpinned, uv took an
        # older interpreter on self-hosted runner and the guard died on a SyntaxError.
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.2 python .github/own-runners/guard.py
