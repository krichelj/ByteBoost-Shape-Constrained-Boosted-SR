[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "byteboost-2026"
version = "0.1.0"
description = "Shape-Constrained Boosted Symbolic Regression for Interpretable Neural Scaling Laws"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Joshua Shay Kricheli", email = "skricheli2@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[dependency-groups]
lint = [
    "ruff==0.16.5",
]
types = [
    "mypy==2.3.1",
]
test = [
    "pytest>=8.0.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "types" },
    { include-group = "test" },
    "pre-commit>=4.0.0",
]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
